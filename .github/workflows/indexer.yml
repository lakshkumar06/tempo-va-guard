name: Indexer CI

on:
  push:
    paths:
      - "indexer/**"
      - ".github/workflows/indexer.yml"
  pull_request:
    paths:
      - "indexer/**"
      - ".github/workflows/indexer.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
